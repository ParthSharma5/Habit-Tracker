<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 1: Calendar checkbox -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <rect x="12" y="10" width="40" height="44" rx="6" fill="white" stroke="#334155" stroke-width="1.5"/>
  <rect x="12" y="10" width="40" height="12" rx="6" fill="#f97316"/>
  <rect x="12" y="16" width="40" height="6" fill="#f97316"/>
  <circle cx="32" cy="36" r="12" fill="#bbf7d0"/>
  <polyline points="26,36 30,40 38,32" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">30</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 2: Fire streak / progress -->
  <rect width="64" height="64" rx="12" fill="#1e1b2e"/>
  <text x="32" y="22" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🔥</text>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="bold">7 DAYS</text>
  <rect x="12" y="52" width="40" height="4" rx="2" fill="#334155"/>
  <rect x="12" y="52" width="28" height="4" rx="2" fill="#f97316"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="40 136" transform="rotate(-90 32 32)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 3: 3x3 habit grid -->
  <rect width="64" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="12" y="12" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="26" y="12" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="40" y="12" width="11" height="11" rx="2" fill="#fecaca" stroke="#fca5a5" stroke-width="0.5"/>
  <rect x="12" y="26" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="26" y="26" width="11" height="11" rx="2" fill="#fecaca" stroke="#fca5a5" stroke-width="0.5"/>
  <rect x="40" y="26" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="12" y="40" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="26" y="40" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#86efac" stroke-width="0.5"/>
  <rect x="40" y="40" width="11" height="11" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 4: Habit stacking rings -->
  <rect width="64" height="64" rx="12" fill="#2d2a5a"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="75 76"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="56 57"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="37 38"/>
  <text x="32" y="36" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">68%</text>
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">STREAK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 5: Simple habit check icon -->
  <rect width="64" height="64" rx="12" fill="#ecfdf5"/>
  <circle cx="32" cy="32" r="26" fill="#059669"/>
  <polyline points="22,33 29,41 43,26" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="8" width="14" height="14" rx="3" fill="#fbbf24"/>
  <text x="51" y="19" font-family="Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle" font-weight="bold">✓</text>
</svg>


  </g>
  <g transform="translate(8, 35)">
    <rect x="0" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="8" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="16" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="24" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="32" y="0" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="40" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="48" y="0" width="6" height="6" rx="1" fill="#10b981"/>
  </g>
  <g transform="translate(8, 46)">
    <rect x="0" y="0" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="8" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="16" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="24" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="32" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="40" y="0" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="48" y="0" width="6" height="6" rx="1" fill="#fbbf24"/>
